services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tableflow}
      POSTGRES_USER: ${POSTGRES_USER:-tableflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tableflow-dev-password}
    ports:
      - "55432:5432"
    volumes:
      - tableflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tableflow} -d ${POSTGRES_DB:-tableflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tableflow}:${POSTGRES_PASSWORD:-tableflow-dev-password}@db:5432/${POSTGRES_DB:-tableflow}
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-before-deployment}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TABLEFLOW_DEMO_HOST_EMAIL: ${TABLEFLOW_DEMO_HOST_EMAIL:-host@tableflowdemo.com}
      TABLEFLOW_DEMO_HOST_PASSWORD: ${TABLEFLOW_DEMO_HOST_PASSWORD:-tableflow-host-dev-password}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    command: >-
      sh -c "uv run --no-sync alembic upgrade head &&
      uv run --no-sync python -m app.db.seed &&
      uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_RESTAURANT_ID: ${NEXT_PUBLIC_RESTAURANT_ID:-1}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  tableflow_postgres:
